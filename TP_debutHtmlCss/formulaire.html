<!DOCTYPE html>
<html>
    <head>
        <strong>Formulaire</strong>
    </head>
    <body>
        <form><!--form est utilise pour les formulaires c'est a dire pour capter des informations chez un visiteur du site-->
            <label for="nom">Nom:</label>
            <input id="nom" type="text" name="nom" placeholder="veuillez entrer  votre nom">
        
            <br><textarea cols="50" rows="20"></textarea>
            
            
            <br><input type="checkbox" value="velo"><strong>velo</strong>
            <br>
            <input type="checkbox" value="voiture"><strong>voiture</strong>
            <br>
            <input type="checkbox" value="avion"><strong>avion</strong>
            <br>
             <!--le checkbox est utilise pour donner plusieurs option de selection -->

            <br><br><input type="radio" value="hommme" name="sex"><strong>homme</strong>
            <br>
            <input type="radio" value="femme" name="sex"><strong>femme</strong>
            <br>
           <!--le radio est utilise pour donner une seule option de selection-->
        
            <br><br><select name="Marque de voiture ">

                <option value="Aucun">Aucun</option>
                <option value="Jeep">Jeep</option>
                <option value="KIA">KIA</option>
                <option value="Mercedes">Mercedes</option>
                <option value="bugatti">bugatti</option>
                <option value="BMW">BMW</option>


            </select>
            <br><br><input type="submit" value="valider" style="background-color:green ; font: seize 20px">
        
        
        </form>
    </body>
</html>
